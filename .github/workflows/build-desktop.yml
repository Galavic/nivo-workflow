name: Build Nivo for macOS and Linux

# Builds the private Galavic/Nivo source (read with a read-only deploy key).
# Apps are not signed by Apple or a Linux distribution. Update files are signed
# afterwards on the maintainer's computer, so the updater key never reaches GitHub.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Galavic/Nivo to build
        required: true

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Galavic/Nivo
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.NIVO_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop
      - name: Build
        working-directory: desktop
        run: >-
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
      - name: Package
        run: |
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir out
          if [ "$RUNNER_OS" = "macOS" ]; then
            arch=${{ matrix.artifact }}; arch=${arch#macos-}
            cp "$bundle"/dmg/*.dmg out/
            # Same layout the Tauri updater expects: Nivo.app at the archive root.
            COPYFILE_DISABLE=1 tar -czf "out/Nivo_${version}_${arch}.app.tar.gz" -C "$bundle/macos" Nivo.app
          else
            cp "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb out/
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: nivo-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
