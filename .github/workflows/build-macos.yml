name: Build Nivo for macOS

# Builds the private Galavic/Nivo source on GitHub's macOS runners.
# The app is ad-hoc signed only. Update archives are signed afterwards on the
# maintainer's computer, so the updater key never reaches GitHub.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Galavic/Nivo to build
        required: true

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Galavic/Nivo
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.NIVO_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop
      - name: Build
        working-directory: desktop
        run: >-
          npx tauri build --ci --target ${{ matrix.target }} --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
      - name: Package
        run: |
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir out
          cp "$bundle"/dmg/*.dmg out/
          # Same layout the Tauri updater expects: Nivo.app at the archive root.
          COPYFILE_DISABLE=1 tar -czf "out/Nivo_${version}_${{ matrix.arch }}.app.tar.gz" -C "$bundle/macos" Nivo.app
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: nivo-macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
